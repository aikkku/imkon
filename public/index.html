<!DOCTYPE html>
<html lang="en">
  <head>
    <meta name="author" content="Asilbek Ismatilloev, Javlonbek Khamzaev">

    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="A smart study abroad platform, powered by AI and built by successful people for future success stories."
    />
    <link rel="icon" type="image/x-icon" href="%PUBLIC_URL%/favicon.ico" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->

    <meta name="keywords" content="
      study abroad, apply to college, international universities, scholarships for Uzbek students, TOEFL, IELTS, SAT, ACT, GPA, US universities, college counseling, AI college advisor, student visa, education abroad,
      учёба за границей, поступление за рубеж, международные университеты, стипендии для студентов из Узбекистана, TOEFL, IELTS, SAT, ACT, GPA, университеты США, студенческая виза, поступление за границу, обучение в Америке, консультант по обучению,
      chet elda o‘qish, xalqaro universitetlar, AQSh universitetlari, stipendiya, GPA, TOEFL, IELTS, SAT, ACT, talabalar vizasi, IMKON platformasi, xorijda o‘qish, universitetga hujjat topshirish, AI ta’lim maslahatchi
      "
    >
    <!-- Canonical link (use your real domain) -->
    <link rel="canonical" href="https://imkon.pro" />

    <!-- Open Graph (for Facebook, LinkedIn) -->
    <meta property="og:title" content="IMKON – AI-Powered College Counseling for Global Students" />
    <meta property="og:description" content="Built by successful students, IMKON guides you through applying abroad with AI tools and expert help." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://imkon.pro" />
    <meta property="og:image" content="%PUBLIC_URL%/og-image.jpg" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="IMKON – AI-Powered College Counseling for Global Students" />
    <meta name="twitter:description" content="AI-powered college counseling for students in Uzbekistan." />
    <meta name="twitter:image" content="%PUBLIC_URL%/twitter-card.jpg" />

    <script>
      let c = '';
      let g = ' IMKON';

      let i = 0;
      let s = ["◢", "◣", "◤", "◥"];

      function loop() {
        c = s[i];
        document.title = c + g;
        i = (i+1)%4;
      }

      setInterval(loop, 200);
    </script>
    <title>IMKON</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
